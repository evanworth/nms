
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBlock v3.6</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#003366" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <img src="nms-logo.png" alt="Nissitissit Middle School Patriots logo" class="logo" />
  <h1>NextBlock - Nissitissit Middle School</h1>
  <div class="clock" id="clock"></div>
  <div class="today-date" id="todayDate"></div>
  <div class="school-countdown" id="schoolCountdown"></div>

  <div class="period-box" id="periodBox">
    <div id="dayType"></div>
    <div id="currentPeriod"></div>
    <div class="time-left" id="timeRemaining"></div>
    <div class="next-period" id="nextPeriod"></div>
    <div id="lunchStatus"></div>
  </div>

  <div class="lunch-weather-container">
    <div class="lunch-box">
      <h3>Lunch Schedule</h3>
      <p id="lunch5">Grade 5: 10:50 - 11:20</p>
      <p id="lunch8">Grade 8: 11:22 - 11:52</p>
      <p id="lunch7">Grade 7: 11:54 - 12:24</p>
      <p id="lunch6">Grade 6: 12:26 - 12:56</p>
    </div>

    <div id="weatherBox">Loading Pepperell weather...</div>
  </div>

  <footer>Patriot Pride Starts With You · Nissitissit Middle School</footer>

  <script defer src="app.js"></script>
</body>
</html>
